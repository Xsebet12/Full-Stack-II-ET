spring.application.name=Proyecto-Fullstack-ll-React

spring.datasource.url=jdbc:mysql://localhost:3306/bdyouka?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=AdminSeba
spring.datasource.password=BEWD2701.OMG
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Opcional: definir schema por defecto (ajusta si trabajas con un schema específico)
# spring.jpa.properties.hibernate.default_schema=SCHEMA

# Opcional (Wallet/SSL): validar el DN del servidor; algunos wallets lo requieren
# spring.datasource.hikari.data-source-properties.oracle.net.ssl_server_dn_match=true

# Server port opcional
server.port=8080
server.address=0.0.0.0

# Desactivar autoconfiguración de Spring AI Oracle Vector Store para evitar requerir EmbeddingModel si no se usa
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.oracle.autoconfigure.OracleVectorStoreAutoConfiguration

# JWT
jwt.secret=CHANGE-ME-USE-32-CHARS-MINIMUM-SECRET-KEY
jwt.expiration-ms=3600000

# Debug authorization internals
logging.level.org.springframework.security.web.access.intercept=DEBUG
logging.level.org.springframework.security.authorization=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.SebastianCornejo.Proyecto.Fullstack=DEBUG
spring.security.debug=true
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
spring.jpa.open-in-view=true

# Springdoc / Swagger UI settings
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DevTools: auto-restart is enabled by default when on classpath; disable restart logging
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Debug endpoints (disable in production)
app.debug.enabled=false
# Desactivar carga de data.sql si existe
spring.sql.init.mode=never
